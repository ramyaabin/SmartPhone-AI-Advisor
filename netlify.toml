# Netlify config for the frontend. Netlify reads this file from the repo root.
# Set VITE_API_BASE_URL in the Netlify UI to your Render backend URL + /api.
[build]
  base = "mobile-ai-store/frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # The live demo has no Chroma server, so only offer the FAISS retrieval path.
  VITE_RETRIEVAL_BACKENDS = "faiss"
