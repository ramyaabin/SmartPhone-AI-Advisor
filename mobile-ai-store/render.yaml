services:
  - type: web
    name: mobile-ai-store-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: RETRIEVAL_BACKEND
        value: chroma
      - key: CLIENT_ORIGIN
        sync: false
      - key: TOP_K
        value: "4"
